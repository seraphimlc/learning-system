const STORAGE_KEY='primary_math_review_marks_v1';
const NOTE_KEY='primary_math_review_notes_v1';
let activePage=DATA[0].id;let filter='all';let marks={};
try{marks=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{marks={}}
const app=document.getElementById('app'), tabsEl=document.getElementById('tabs'), pagesEl=document.getElementById('pages'), search=document.getElementById('search'), empty=document.getElementById('empty');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function answerClass(i){return i>=2?' answer':''}
function render(){
  tabsEl.innerHTML=DATA.map((p,i)=>`<button class="tab ${i===0?'active':''}" data-page="${p.id}">${esc(p.title)} <small>${p.count}</small></button>`).join('') + '<button class="tab" data-page="wrongbook">错题本 <small>自填</small></button>';
  pagesEl.innerHTML=DATA.map((p,i)=>`<article class="page ${i===0?'active':''}" id="page-${p.id}" data-page="${p.id}"><section class="section"><div class="section-head"><div class="badge">${esc(p.title[0])}</div><div class="count">${p.count} 项</div></div><div class="table-wrap"><table><thead><tr>${p.columns.map((c,idx)=>`<th class="${answerClass(idx).trim()}">${esc(c)}</th>`).join('')}<th class="mark">检测标记</th></tr></thead><tbody>${p.rows.map(r=>`<tr class="row" data-page="${p.id}" data-key="${esc(r.key)}" data-search="${esc(r.search)}">${r.cells.map((c,idx)=>`<td class="${answerClass(idx).trim()}">${esc(c)}</td>`).join('')}<td class="mark"><div class="row-actions"><span class="status">未测</span><button class="mini ok" data-mark="correct">会</button><button class="mini bad" data-mark="wrong">不会</button><button class="mini clear" data-mark="clear">清除</button></div></td></tr>`).join('')}</tbody></table></div></section>${p.id==='mental'?practiceHtml():''}</article>`).join('') + wrongbookHtml();
}
function practiceHtml(){return `<section class="section practice"><div class="panel"><div class="section-head"><div class="badge">练</div><div><b>随机口算</b><div class="count">每天 5 分钟，比一次刷很多更有效。</div></div></div><select id="practiceType" class="btn"><option value="int">整数四则</option><option value="decimal">小数加减</option><option value="fraction">简单分数</option><option value="percent">百分数互化</option></select><button class="btn" id="newProblem">出一题</button><div class="problem" id="problem">点“出一题”开始</div><input class="answer-input" id="answerInput" placeholder="答案"><button class="btn" id="checkProblem">检查</button><span class="result" id="practiceResult"></span></div><div class="panel"><b>口算错题临时记录</b><div class="wrong-list" id="practiceWrong">这里会显示本次做错的题。</div></div></section>`}
function wrongbookHtml(){return `<article class="page" id="page-wrongbook" data-page="wrongbook"><section class="section"><div class="section-head"><div class="badge">错</div><div><b>错题本</b><div class="count">建议格式：题目 / 错因 / 正确方法 / 下次是否会。</div></div></div><textarea id="wrongNotes" placeholder="例：圆锥体积题——忘记乘 1/3——先写 V=1/3Sh，再代入。"></textarea></section></article>`}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(marks))}
function rows(){return Array.from(document.querySelectorAll('.row'))}
function visibleRows(){return rows().filter(r=>r.dataset.page===activePage)}
function applyRow(row){const mark=marks[row.dataset.key];row.classList.toggle('correct',mark==='correct');row.classList.toggle('wrong',mark==='wrong');row.querySelector('.status').textContent=mark==='correct'?'✓ 会':mark==='wrong'?'✕ 不会':'未测'}
function updateStats(){const list=visibleRows();const c=list.filter(r=>marks[r.dataset.key]==='correct').length;const w=list.filter(r=>marks[r.dataset.key]==='wrong').length;document.getElementById('totalCount').textContent=list.length;document.getElementById('correctCount').textContent=c;document.getElementById('wrongCount').textContent=w;document.getElementById('untestedCount').textContent=list.length-c-w}
function applyFilters(){const q=search.value.trim().toLowerCase();let count=0;rows().forEach(row=>{const pageOK=row.dataset.page===activePage;const mark=marks[row.dataset.key];const filterOK=filter==='all'||mark===filter;const searchOK=!q||row.dataset.search.includes(q);const show=pageOK&&filterOK&&searchOK;row.style.display=show?'':'none';if(show)count++});document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===activePage));empty.style.display=(count||activePage==='wrongbook')?'none':'block'}
function bind(){
  document.querySelectorAll('.row').forEach(row=>{applyRow(row);row.addEventListener('click',e=>{const b=e.target.closest('[data-mark]');if(!b)return;const k=row.dataset.key;if(b.dataset.mark==='clear')delete marks[k];else marks[k]=b.dataset.mark;save();applyRow(row);updateStats();applyFilters()})});
  document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{activePage=tab.dataset.page;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));search.value='';updateStats();applyFilters();if(activePage==='mental')bindPractice();if(activePage==='wrongbook')bindNotes();window.scrollTo({top:0,behavior:'smooth'})}));
  document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===btn));applyFilters()}));
  search.addEventListener('input',applyFilters);document.getElementById('toggleAnswer').addEventListener('click',e=>{app.classList.toggle('hidden-answer');e.currentTarget.textContent=app.classList.contains('hidden-answer')?'显示方法/答案':'隐藏方法/答案'});
  document.getElementById('clearPage').addEventListener('click',()=>{if(!confirm('确定清空当前页所有标记吗？'))return;visibleRows().forEach(r=>delete marks[r.dataset.key]);save();rows().forEach(applyRow);updateStats();applyFilters()});
}
let currentProblem=null, practiceWrong=[];
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function frac(n,d){const g=gcd(n,d);return [n/g,d/g]}
function makeProblem(){const t=document.getElementById('practiceType')?.value||'int';let q,a;if(t==='int'){const x=10+Math.floor(Math.random()*90),y=2+Math.floor(Math.random()*18),ops=['+','-','×','÷'];const op=ops[Math.floor(Math.random()*ops.length)];if(op==='+'){q=`${x} + ${y} = ?`;a=String(x+y)}else if(op==='-'){q=`${x} - ${y} = ?`;a=String(x-y)}else if(op==='×'){q=`${x} × ${y} = ?`;a=String(x*y)}else{q=`${x*y} ÷ ${y} = ?`;a=String(x)}} else if(t==='decimal'){const x=(Math.floor(Math.random()*90)+10)/10,y=(Math.floor(Math.random()*50)+1)/10;q=`${x.toFixed(1)} + ${y.toFixed(1)} = ?`;a=(x+y).toFixed(1)} else if(t==='fraction'){const d=[4,5,6,8,10][Math.floor(Math.random()*5)],n1=1+Math.floor(Math.random()*(d-1)),n2=1+Math.floor(Math.random()*(d-n1));const [n,dd]=frac(n1+n2,d);q=`${n1}/${d} + ${n2}/${d} = ?`;a=dd===1?String(n):`${n}/${dd}`} else {const pairs=[['1/2','50%'],['1/4','25%'],['3/4','75%'],['1/5','20%'],['1/8','12.5%'],['0.6','60%'],['0.25','25%']];const p=pairs[Math.floor(Math.random()*pairs.length)];q=`${p[0]} = ?`;a=p[1]} currentProblem={q,a};document.getElementById('problem').textContent=q;document.getElementById('answerInput').value='';document.getElementById('practiceResult').textContent=''}
function bindPractice(){const n=document.getElementById('newProblem'),c=document.getElementById('checkProblem');if(!n||n.dataset.bound)return;n.dataset.bound='1';n.addEventListener('click',makeProblem);c.addEventListener('click',()=>{if(!currentProblem)return;const v=document.getElementById('answerInput').value.trim().replace('％','%');const ok=v===currentProblem.a;document.getElementById('practiceResult').textContent=ok?'✓ 正确':`✕ 答案：${currentProblem.a}`;document.getElementById('practiceResult').style.color=ok?'#16a34a':'#dc2626';if(!ok){practiceWrong.unshift(`${currentProblem.q} 答案：${currentProblem.a}`);document.getElementById('practiceWrong').innerHTML=practiceWrong.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')}})}
function bindNotes(){const ta=document.getElementById('wrongNotes');if(!ta||ta.dataset.bound)return;ta.dataset.bound='1';ta.value=localStorage.getItem(NOTE_KEY)||'';ta.addEventListener('input',()=>localStorage.setItem(NOTE_KEY,ta.value))}
render();bind();updateStats();applyFilters();
</script></body></html>
